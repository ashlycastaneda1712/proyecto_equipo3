<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style_galeria.css">
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card-vintage">
                <h2 class="text-center">Escríbenos</h2>
                <p class="text-center italic">Nos encantaría saber de ti, como en los viejos tiempos.</p>
                <form>
                    <div class="mb-3">
                        <label class="form-label">Nombre Completo</label>
                        <input type="text" class="form-control" placeholder="Ej. Alex Gomez">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" placeholder="nombre@ejemplo.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mensaje</label>
                        <textarea class="form-control" rows="4" placeholder="Escribe tu nota aquí..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-vintage w-100">Enviar Mensaje</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
