<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservaciones - Café Aurora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .page-header {
            padding: 120px 20px 40px;
            text-align: center;
            background-color: transparent;
            border-bottom: 1px solid rgba(174, 124, 82, 0.2);
        }

        .page-header h1 {
            color: var(--bg-dark);
            font-size: 3rem;
        }

        .success-msg {
            display: none;
            background: rgba(40, 167, 69, 0.2);
            border: 1px solid #28a745;
            color: #28a745;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- Navegación -->
    <header class="navbar">

    </header>

    <div class="page-header">
        <h1>Reservaciones</h1>
        <p>Asegura tu mesa en nuestro espacio atemporal.</p>
    </div>

    <!-- Sección de Reservación -->
    <div class="container-fluid py-5">
        <div class="row align-items-center justify-content-center text-center">
            <div class="col-md-4 col-12 mb-4 d-flex justify-content-center">
                <img src="images/reservaciones.png" alt="Imagen Reservaciones" class="img-fluid rounded"
                    style="max-width: 600px;">
            </div>
            <div class="col-md-4 col-12 mb-4 d-flex justify-content-center">
                <section class="form-section w-100" style="background-color: var(--bg-light); max-width:600px">
                    <div class="form-container p-5">
                        <h3 class="text-center mb-3" style="color: var(--bg-dark);">
                            Reserva tu Mesa
                        </h3>
                        <div id="reservaSuccess" class="success-msg text-center">
                            ¡Reservación guardada con éxito!
                        </div>
                        <form id="reservaForm">
                            <div class="form-group mb-3 text-start">
                                <label for="resNombre">Nombre Completo</label>
                                <input type="text" id="resNombre" class="form-control" required>
                            </div>
                            <div class="form-group mb-3 text-start">
                                <label for="resFecha">Fecha de la Reserva</label>
                                <input type="date" id="resFecha" class="form-control" required>
                            </div>
                            <div class="form-group mb-3 text-start">
                                <label for="resHora">Hora</label>
                                <input type="time" id="resHora" class="form-control" required>
                            </div>
                            <div class="form-group mb-3 text-start">
                                <label for="resPersonas">Número de Personas</label>
                                <select id="resPersonas" class="form-control" required>
                                    <option value="1">1 Persona</option>
                                    <option value="2">2 Personas</option>
                                    <option value="3">3 Personas</option>
                                    <option value="4">4 Personas</option>
                                    <option value="5+">5 o más</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                Confirmar Reservación
                            </button>
                        </form>
                    </div>
                </section>
            </div>
            <div class="col-md-4 col-12 mb-4 d-flex justify-content-center">
                <img src="images/reservaciones2.png" alt="Imagen Reservaciones" class="img-fluid rounded"
                    style="max-width: 600px;">
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">

    </footer>

    <script>
        // Funcionalidad para la Reservación
        const reservaForm = document.getElementById('reservaForm');
        reservaForm.addEventListener('submit', function (e) {
            e.preventDefault();

            const reserva = {
                id: Date.now(),
                nombre: document.getElementById('resNombre').value,
                fecha: document.getElementById('resFecha').value,
                hora: document.getElementById('resHora').value,
                personas: document.getElementById('resPersonas').value
            };

            // Obtener reservaciones previas
            let reservaciones = JSON.parse(localStorage.getItem('reservacionesAurora')) || [];
            reservaciones.push(reserva);

            // Guardar en localStorage
            localStorage.setItem('reservacionesAurora', JSON.stringify(reservaciones));

            // Mostrar mensaje de éxito y limpiar form
            const successMsg = document.getElementById('reservaSuccess');
            successMsg.style.display = 'block';
            reservaForm.reset();

            setTimeout(() => {
                successMsg.style.display = 'none';
            }, 3000);
        });

        // Fin de script de reservaciones
    </script>
</body>

</html>
