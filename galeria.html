<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style_galeria.css">
</head>

<body>
    <div class="container mt-5 text-center">
        <h1>NUESTRA GALERIA</h1>
        <div class="row mt-4">
            <div class="col-md-4 col-sm-6">
                <div class="img-container">
                    <img src="galeria/img1.png" class="img-fluid gallery-img" alt="Foto 1">
                    <div class="caption text-center mt-2">La Seleccion del Grano</div>
                </div>
            </div>
            <div class="col-md-4 col-sm-6">
                <div class="img-container">
                    <img src="galeria/img2.png" class="img-fluid gallery-img" alt="Foto 2">
                    <div class="caption text-center mt-2">El Arte del Barista</div>
                </div>
            </div>
            <div class="col-md-4 col-sm-6">
                <div class="img-container">
                    <img src="galeria/img3.png" class="img-fluid gallery-img" alt="Foto 3">
                    <div class="caption text-center mt-2">El Proceso Artesanal</div>
                </div>
            </div>
            <div class="col-md-4 col-sm-6">
                <div class="img-container">
                    <img src="galeria/img4.png" class="img-fluid gallery-img" alt="Foto 4">
                    <div class="caption text-center mt-2">La Dulce Tentación</div>
                </div>
            </div>
            <div class="col-md-4 col-sm-6">
                <div class="img-container">
                    <img src="galeria/img5.png" class="img-fluid gallery-img" alt="Foto 5">
                    <div class="caption text-center mt-2">El Ambiente Acogedor</div>
                </div>
            </div>
            <div class="col-md-4 col-sm-6">
                <div class="img-container">
                    <img src="galeria/img6.png" class="img-fluid gallery-img" alt="Foto 6">
                    <div class="caption text-center mt-2">El Producto Final</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Overlay para imagen ampliada -->
    <div id="overlay">
        <img src="" id="fullImage" alt="Vista previa">
    </div>

    <script src="js/script_galeria.js"></script>
</body>

</html>
